<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>selftest</title></head>
<body>
<pre id="out">running...</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const key = new URLSearchParams(location.search).get('testkey') || '';
  if (!key) { out.textContent = 'NO_KEY'; return; }
  const body = {
    model: 'deepseek-chat',
    stream: true,
    temperature: 0.6,
    messages: [
      { role: 'system', content: '你是测试助手，用一句话回答。' },
      { role: 'user', content: '请回复：流式测试成功' },
    ],
  };
  try {
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify(body),
    });
    out.textContent = 'HTTP=' + res.status + '\n';
    if (!res.ok) { out.textContent += (await res.text()).slice(0, 300); return; }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '', chunks = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        const s = line.trim();
        if (!s.startsWith('data:')) continue;
        const p = s.slice(5).trim();
        if (p === '[DONE]') continue;
        try {
          const j = JSON.parse(p);
          const d = j && j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (d) { text += d; chunks++; }
        } catch (e) {}
      }
    }
    out.textContent = 'HTTP=' + res.status + ' CHUNKS=' + chunks + ' LEN=' + text.length + '\nTEXT=' + text;
  } catch (e) {
    out.textContent = 'ERR=' + (e && e.message ? e.message : String(e));
  }
})();
</script>
</body>
</html>
